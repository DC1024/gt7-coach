# GT7 赛道工程师 —— Docker Compose 部署
# ================================================================
# 部署：docker compose up -d
# 查看：docker compose logs -f
# 自检：http://<本机IP>:8788/          （自带页面，点一下就能听）
# 状态：curl http://127.0.0.1:8788/api/v1/coach/health
#
# ⚠️ network_mode: host 的理由
#    要连宿主机的 127.0.0.1:8787（GT7 Dash）。bridge 模式下这个地址指向
#    容器自己，连不上；host 模式最简单，也免得为了一个本地 HTTP 去改
#    Dash 的监听地址。同理端口不用 ports: 映射（host 模式下直接占宿主机）。
#
# ⚠️ 和 GT7 Dash 是两个**独立项目**：本服务只通过 HTTP 读它的公开 v1。
#    它挂了/没起，赛道工程师会一直退避重试，不会崩；反过来也一样。

services:
  gt7-coach:
    build:
      context: .
      dockerfile: Dockerfile
    image: gt7-coach:latest
    container_name: gt7-coach

    network_mode: host

    restart: unless-stopped

    # 负载很低（10Hz 拉一次 live + 少量计算），限一下防止异常时吃满
    deploy:
      resources:
        limits:
          cpus: "0.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      TZ: Asia/Shanghai
      # 🔴 百炼 key 由**你自己**填：仓库里不放、部署脚本也不传，本服务不代管。
      #    要用云措辞就取消下面注释，并在服务器上 export GT7_COACH_LLM_KEY=sk-xxx
      #    （或写进本目录的 .env，已 gitignore）。不填 = 纯本地模板，零外呼。
      #    语言模型和语音合成共用这一把 key（key 是业务空间级的）。
      # GT7_COACH_LLM_KEY: ${GT7_COACH_LLM_KEY:-}

    volumes:
      # 运行态配置（云措辞 cloud.json + 用户设置 ui.json）。必须持久化：
      # 卡片里改的模型名、打滑灵敏度、规则开关都会写回这里，容器重建/重新部署
      # 都不该把它们冲回默认值。
      - ./data:/opt/gt7-coach/data

    command:
      - serve
      - --dash
      - http://127.0.0.1:8787
      # 指向持久化路径，仪表盘卡片的「云措辞模型」输入框才有地方写
      # （不配这个，卡片会提示「未配置 cloud.json 路径」）
      - --cloud
      - /opt/gt7-coach/data/cloud.json
      # 用户设置（打滑灵敏度 / 逐规则开关 / 静音分组）落盘 → 重启后不回默认
      - --ui-state
      - /opt/gt7-coach/data/ui.json
      - --bind
      - 0.0.0.0
      - --port
      - "8788"
