name: 发行版

# 推 v* tag 时自动创建 GitHub Release。
#
# 为什么要用 Actions 而不是本地调 API：本机网络只放行 SSH 443，
# api.github.com 无路由，本地拿不到 REST 接口。把这一步交给 Actions
# 在 GitHub 侧执行，就不需要本地出网了（Pages 那步同因）。
#
# 发行说明的来源分两段：
#   1. 本文件里手写的 `body`（结构性总结，随版本维护）
#   2. `generate_release_notes: true` 让 GitHub 自动附上
#      "What's Changed"（按 PR/commit 生成）—— 两者拼在一起
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 发行说明要对比上一个 tag，浅克隆拿不到

      - name: 校验 tag 与包版本一致
        run: |
          TAG="${GITHUB_REF_NAME}"                 # 形如 v1.0.0-beta.1
          PKG=$(python3 -c "import re,pathlib; \
            print(re.search(r'version = \"([^\"]+)\"', \
            pathlib.Path('pyproject.toml').read_text()).group(1))")
          echo "tag=$TAG  pyproject=$PKG"
          # 1.0.0-beta.1 与 PEP 440 的 1.0.0b1 是同一个版本：
          # 把 SemVer 的 -beta.N 归一成 bN 再比，避免把正确的事情判成不一致。
          NORM=$(printf '%s' "$TAG" | sed -E 's/^v//; s/-beta\.([0-9]+)$/b\1/; s/-alpha\.([0-9]+)$/a\1/; s/-rc\.([0-9]+)$/rc\1/')
          if [ "$NORM" != "$PKG" ]; then
            echo "::error::tag 与 pyproject 版本不一致：$TAG -> $NORM vs $PKG"
            exit 1
          fi
          echo "版本一致 ✓"

      - name: 自检（确认 tag 指向的代码真能跑）
        run: |
          python3 -m pip install --upgrade pip pytest >/dev/null
          python3 -m pytest tests/ -q

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "gt7-coach v1.0.0-beta.1 — 赛道工程师（首个公开 beta）"
          prerelease: true
          generate_release_notes: true
          body: |
            > 本机网络只放行 SSH 443，`api.github.com` 无路由，因此本地无法
            > 直接调用 REST 创建 Release；由本工作流在 tag 推送后代为创建。

            ## 这是什么

            给 PS5《GT7》当**实时副驾**：盯着遥测数据，在你该被提醒的那一刻说一句话 ——
            **边开边说**，不是事后剪辑解说。配合 [GT7 Dash](https://github.com/DC1024/gt7-dash)
            一起用。

            👉 **宣传页**：<https://dc1024.github.io/gt7-coach/>

            ## 快速开始

            ```bash
            git clone https://github.com/DC1024/gt7-coach && cd gt7-coach
            docker compose up -d
            curl http://127.0.0.1:8788/api/v1/coach/health
            ```

            也可以不装 Docker，直接跑（需要 Python 3.10+）：

            ```bash
            python -m gt7coach demo       # 自检：内置合成赛道跑一遍，不连任何东西
            python -m gt7coach serve --dash http://192.168.43.18:8787   # 接真车
            ```

            **不需要 `pip install` 任何东西** —— 整个包只用标准库。

            ## 三条设计原则

            | 原则 | 含义 |
            |---|---|
            | **判断在本地，措辞才上云** | 「该不该说、说的是哪个数」全部本地确定性代码算完（毫秒级、零成本、不会编数字）。云只管把结论变成一句人话。 |
            | **按延迟分档，硬实时档禁走云** | A 档 < 300 ms 全本地。一次云调用 0.5~2 s，250 km/h 时 2 秒 = 139 米 —— 「T1 刹车点提前 10 米」晚 139 米就是废话。 |
            | **不打扰，优先于多说话** | 一个话痨副驾比没有副驾更糟。四道闸拦着：同类冷却 20 s、跨类冷却 6 s、每圈上限、同一个弯只提醒一次。 |

            ## 主要能力

            **实时播报**（14 条规则，P0~P3 四档优先级）

            - 出界了，回到赛道
            - 前轮 / 后轮 / 四轮打滑
            - 刹车晚了 N 米
            - 1.5 秒后重刹区
            - 该换挡了
            - 弯心慢了 N
            - 给油晚了
            - 轮胎太凉 / 过热
            - 圈后：S2 慢 0.31，还差 0.80
            - 圈后：油还够 2.4 圈
            - **跨圈累积：T3 连续 3 圈慢 0.40**（教练区别于仪表盘的地方）
            - 每圈成绩与参考差：1:32.412，慢 0.37
            - 预测最终圈速
            - **名次与情绪：P5，追回 2 位 / 后半区鼓励 / 领跑提醒**（本版新增）

            **全本地能算的**（一个接口都不调）：分段用时 S1/S2/S3、理论最快圈、
            每圈油耗与续航、预测圈速、轮胎半径自标定、跨场次历史参考圈。

            ## 本版重点变化

            ### R3.1 名次与情绪向播报

            新读 `car.race` 块拿到名次，播报超车 / 掉位、后半区鼓励、领跑提醒。

            这类话按设计定级 P_LOW（永不抢占驾驶指导），所以**单独给它一个小配额**
            （每圈 2 条），不和刹车点 / 弯心那些硬信息抢那 6 条额度 ——
            否则会被挤到一粒不剩（实测过一场 16 车 6 圈的 Spa，23 条候选播出 0 条）。

            ### 修掉「候选活不过一个 tick」的闸门 bug

            规则**产出候选** ≠ 话被说出。有状态位的规则（名次记忆、上次鼓励圈、
            是否已在领跑）原本在**产出候选时**就推进状态，于是候选只活一个 tick：
            而名次变化总是发生在超车那一刻 = 刹车点 / 弯中 = 驾驶指导最密集的时刻，
            必然被每 tick 上限跳过 → 候选永久消失。

            修法：状态推进改挂在**闸门放行之后**（`RuleSet.on_spoken` 回调），
            只有真念出口了才记账。

            实测（真实 Spa 场次，16 车 6 圈，46318 帧）：总播报 36 → 41 条，
            **名次播报 0 → 5 条**，形成完整超车叙事线 `P7→P5→P4→P2→P1`，
            且只多 5 条（对照：放开配额到 99 会涨到 81 条，太吵）。

            顺带修掉一个排障陷阱：闸门 `if len(out) >= max_per_tick: break`
            那一支原本不递增丢弃计数，报告永远显示「闸门丢掉 0 条」，
            让人误判成"闸门什么都没拦"。现在 `dropped`（轮到了但被冷却/配额判掉）
            与 `skipped`（排队没轮上）分开报。

            ### 参考圈分层

            参考圈的「几何面」（赛车线形状、刹车点与弯心位置）可跨车型迁移，
            被出界、给油晚两条规则使用；「速度面」（速度与时间）不可迁移，
            被其余规则使用。三态车型判定 `same_car` / `cross_car` / `unknown`，
            同车判据优先用 `car_code`（数字车型码，不过查表，不会因两边都空而误判同车）。

            ### 云措辞与云 TTS（可选）

            云措辞只润色 B 档，失败自动回落本地模板；措辞层有数字白名单
            （句中每个数字都必须能在 evidence 里找到）与长度预算两道约束。
            云 TTS 同样只给 B/C 档 —— **A 档必须保持本地**。

            可靠性层：措辞幂等缓存、熔断退避、降级状态位。
            **防静默扣费**：默认只走免费模型，付费模型必须显式填名字。

            ## 数据边界的诚实清单

            GT7 遥测是**单车流**，有些东西就是拿不到。不瞎编是硬规矩。

            | 拿不到 | 所以不说 |
            |---|---|
            | 只有你一台车的数据 | 不能说「Hamilton 在你后面 0.8 秒」，只能说名次 |
            | 胎压 / 胎耗（遥测格式 A 恒为 0） | 不能说「胎耗 12%」，只能说胎温 |
            | 协议没有转向角 | 已用曲率 κ = G_lat·g/v² 替代（半径 + 左右方向） |
            | 没有赛道里程碑 | 不能说「100 米标刹车」，只能说「1.5 秒后重刹区」 |

            最后一条恰好是这个项目的性格：**说不了解精确的距离，就说你来得及反应的时间。**

            ## 已知限制

            - 这是 **beta**：接口与播报措辞仍可能调整
            - 需要配合 [GT7 Dash](https://github.com/DC1024/gt7-dash) 提供遥测；
              两个仓库只通过 HTTP 契约耦合，可以跨机器
            - 云措辞 / 云 TTS 需要自备 API key；不配也全功能可用

            ## 测试

            全量 **713 passed**（纯标准库 + pytest，无第三方运行时依赖）。

